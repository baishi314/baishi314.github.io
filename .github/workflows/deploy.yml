name: Build and Deploy Sites

on:
  push:
    branches: [main]
    paths:
      - 'minimal-src/**'
      - 'anime-src/**'
      - 'xinghui-src/**'
      - 'assets/**'
      - 'index.html'
      - 'index.about.html'
      - 'sportworld.html'
      - 'downloads/**'
      - 'tools/**'
      - 'skill-tree/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # ---------- PaperMod (Hugo) ----------
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      - name: Build PaperMod site
        if: hashFiles('minimal-src/hugo.toml') != ''
        timeout-minutes: 5
        run: |
          # 主题已随仓库提交；若缺失则回退到在线拉取
          if [ ! -f minimal-src/themes/PaperMod/theme.toml ]; then
            echo "::warning::themes/PaperMod 缺失，回退到在线拉取"
            git clone --depth 1 https://github.com/adityatelange/hugo-PaperMod.git /tmp/PaperMod
            mkdir -p minimal-src/themes
            cp -r /tmp/PaperMod minimal-src/themes/PaperMod
            rm -rf minimal-src/themes/PaperMod/.git
          fi
          hugo --source minimal-src --destination "$GITHUB_WORKSPACE/public/minimal" --minify --gc

      # ---------- Firefly (Astro) ----------
      - name: Setup pnpm
        if: hashFiles('anime-src/package.json') != '' || hashFiles('xinghui-src/package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        if: hashFiles('anime-src/package.json') != '' || hashFiles('xinghui-src/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            anime-src/pnpm-lock.yaml
            xinghui-src/pnpm-lock.yaml

      - name: Build Firefly site
        if: hashFiles('anime-src/package.json') != ''
        continue-on-error: true
        timeout-minutes: 15
        env:
          BASE_PATH: /anime/
        run: |
          cd anime-src
          pnpm install --no-frozen-lockfile
          # 恢复随仓库提交的 Astro 字体缓存：GitHub 运行环境访问 Fontsource CDN 会 fetch failed，
          # 命中缓存后 astro build 不再联网抓字体（该缓存由本地 astro build 生成）
          if [ -d ci/fonts-cache ]; then
            mkdir -p node_modules/.astro/fonts
            cp -r ci/fonts-cache/. node_modules/.astro/fonts/
            echo "字体缓存已恢复：$(find node_modules/.astro/fonts -type f | wc -l) 个文件"
          else
            echo "::warning::缺少 anime-src/ci/fonts-cache，构建可能因拉取字体失败"
          fi
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/anime-build.log
          if [ ! -f dist/index.html ]; then
            echo "::error::Firefly 构建未产出 dist/index.html"
            tail -n 80 /tmp/anime-build.log
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/public/anime"
          cp -r dist/* "$GITHUB_WORKSPACE/public/anime/"
          echo "anime 顶层产物条目：$(find "$GITHUB_WORKSPACE/public/anime" -maxdepth 1 | wc -l)"

      # ---------- 星辉小屋 (Next.js 静态导出) ----------
      - name: Build Xinghui site
        if: hashFiles('xinghui-src/package.json') != ''
        continue-on-error: true
        timeout-minutes: 10
        env:
          BASE_PATH: /xinghui
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          cd xinghui-src
          pnpm install --no-frozen-lockfile
          pnpm build
          mkdir -p "$GITHUB_WORKSPACE/public/xinghui"
          cp -r out/* "$GITHUB_WORKSPACE/public/xinghui/"
          # Next 静态导出会写 404.html，放到子路径下避免覆盖根站 404
          rm -f "$GITHUB_WORKSPACE/public/404.html"
          echo "--- xinghui 结构 ---"
          ls -la "$GITHUB_WORKSPACE/public/xinghui" | head -20

      # ---------- 根目录静态文件 ----------
      - name: Copy root static files
        timeout-minutes: 2
        run: |
          mkdir -p public
          if [ -f index.html ]; then cp index.html public/index.html; fi
          if [ -f index.about.html ]; then cp index.about.html public/index.about.html; fi
          if [ -f sportworld.html ]; then cp sportworld.html public/sportworld.html; fi
          if [ -d downloads ]; then mkdir -p public/downloads; cp -r downloads/* public/downloads/; fi
          if [ -d tools ]; then mkdir -p public/tools; cp -r tools/* public/tools/; fi
          if [ -d skill-tree ]; then cp -r skill-tree public/skill-tree; fi
          touch public/.nojekyll
          if [ -d assets ]; then cp -r assets public/; fi
          echo "--- public 结构 ---"
          ls -la public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 8
